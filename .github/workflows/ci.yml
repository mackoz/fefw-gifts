name: ci

on:
  push:
    branches: [master]
  pull_request:

# The deploy job needs to write Pages and mint an OIDC token; everything else
# only reads. Scopes are declared per job rather than here so the test job,
# which runs on untrusted pull requests, never holds write access.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Run the floor and a current release. The first CI run failed because
      # `node --test test/` works on Node 26 but not on 22, where a bare
      # directory is resolved as a module path -- a drift the single-version
      # job could not catch, since local development runs 26.
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate data files
        run: npm run validate
      - name: Run tests
        run: npm test

  deploy:
    # The whole point of deploying from Actions rather than from a branch:
    # invalid data cannot reach the published site, because this job cannot
    # start unless validation and the tests passed on the same commit.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
